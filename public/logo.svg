<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆角方块 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <!-- 画布网格线 -->
  <path d="M14 32H50M32 14V50" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2" fill="rgba(255,255,255,0.25)"/>
  <!-- 播放三角形 -->
  <path d="M27 23L42 32L27 41V23Z" fill="white"/>
  <!-- 光晕 -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)" opacity="0.4"/>
  <defs>
    <linearGradient id="bgGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
