<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 极简画布图标：黑白灰，深色底 + 白色网格 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#171717"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- 画布网格线 -->
  <path d="M14 32H50M32 14V50" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.5" fill="#e5e5e5"/>
  <!-- 四角节点 -->
  <rect x="12" y="12" width="4" height="4" rx="1" fill="#8a8a8a"/>
  <rect x="48" y="12" width="4" height="4" rx="1" fill="#8a8a8a"/>
  <rect x="12" y="48" width="4" height="4" rx="1" fill="#8a8a8a"/>
  <rect x="48" y="48" width="4" height="4" rx="1" fill="#8a8a8a"/>
</svg>
