<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="ArtboardFlow — 无限画布创作工具：AI 生图、生视频、画布编排与素材沉淀" />
        <link rel="icon" href="/logo.svg" />
        <title>ArtboardFlow · 无限画布</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("artboard-flow:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
